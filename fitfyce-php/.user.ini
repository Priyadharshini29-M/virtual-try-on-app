; PHP limits for the upload endpoints. AI Studio has no app-level upload size limit, so the PHP
; defaults (often 2-64 MB) must not be the effective cap. Read by hosts that run PHP through
; CGI/FastCGI/LSAPI (e.g. LiteSpeed). If your host ignores .user.ini, set the same values in its
; PHP settings panel instead.
upload_max_filesize = 256M
post_max_size = 256M
max_execution_time = 120
max_input_time = 120
