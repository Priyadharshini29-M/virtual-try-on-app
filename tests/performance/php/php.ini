; Mirrors a typical production PHP setup; adjust to match the real host's phpinfo().
memory_limit = 256M
post_max_size = 256M
upload_max_filesize = 256M
max_execution_time = 60
opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 0
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
