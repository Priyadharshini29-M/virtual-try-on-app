# fly.toml for fitfyce-py — NOT YET DEPLOYED.
#
# This app is not registered with Fly. Before `fly deploy`:
#   1. Rename `app` below to a real, unclaimed name (or run
#      `fly apps create <name>` and match it here).
#   2. Provision Postgres + Redis (`fly postgres create`, `fly redis create`,
#      or external managed services) and wire their connection strings in
#      as `fly secrets set DATABASE_URL=... REDIS_URL=...` — never commit
#      real credentials to this file.
#   3. Set the remaining secrets the same way: FASHN_API_KEY, FAL_API_KEY,
#      OPENAI_API_KEY, MASTER_API_KEY, SHOPIFY_API_SECRET, and
#      DATABASE_URL_SYNC (same DB, psycopg2 driver — Alembic's sync path).
#   4. Run `scripts/migrate_data.py` against production MySQL once, before
#      any real traffic is pointed here.
#   5. Only after that: update `fitfyce-shopify`'s PHP_API_URL (and its
#      `fly secrets`/fly.toml) to this app's URL, per the phased-cutover
#      plan — one route group at a time, pilot merchants first, PHP staying
#      live as instant rollback.

app = 'fitfyce-api'
primary_region = 'sin'

[build]

[env]
  PUBLIC_BASE_URL = 'https://fitfyce-api.fly.dev'
  FASHN_API_MODE = 'quality'
  UPLOAD_TTL_SECONDS = '600'
  RESULTS_TTL_HOURS = '24'
  STORAGE_DIR = '/data/storage'

[processes]
  api = './docker-entrypoint.sh api'
  worker = './docker-entrypoint.sh worker'

[[mounts]]
  source = 'fitfyce_storage'
  destination = '/data'
  auto_extend_size_threshold = 80
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '10GB'
  processes = ['api']

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['api']

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  memory = '1gb'
  cpus = 1
  memory_mb = 1024
  processes = ['api']

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
  processes = ['worker']
